name: Monthly data integrity

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm run build:api
      - run: npm test
      - run: npm run validate
      - run: npm run validate:standard
      - run: git diff --exit-code -- public
      - uses: actions/upload-artifact@v4
        with:
          name: fashion-data-integrity-${{ github.run_id }}
          path: public/api/v1/manifest.json
